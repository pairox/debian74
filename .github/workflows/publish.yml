name: Publish PHP 7.4 base image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/debian74
          tags: |
            type=raw,value=7.4.33-20261120,priority=1100
            type=raw,value=7.4
            type=raw,value=7.4.33
            type=sha,prefix=sha-
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify patched PHP before publishing
        run: docker run --rm --entrypoint sh ghcr.io/${{ github.repository_owner }}/debian74:7.4.33-20261120 /usr/local/bin/verify-php-security

      - name: Report known image vulnerabilities
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/debian74:7.4.33-20261120
        run: |
          mkdir -p security-reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/security-reports:/reports" \
            aquasec/trivy:latest image --image-src docker --scanners vuln \
            --format json --output /reports/trivy.json "$IMAGE"

      - name: Block publication when fixes exist for high or critical findings
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/debian74:7.4.33-20261120
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --image-src docker --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"

      - name: Save security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-security-report
          path: security-reports/trivy.json
          if-no-files-found: warn

      - name: Publish verified image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [ -z "$image_tag" ] || docker push "$image_tag"
          done <<< "$IMAGE_TAGS"
